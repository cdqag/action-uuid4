name: 🧪 Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: action

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'action/.nvmrc'

      - name: Build action
        run: npm ci && npm run build
        working-directory: action

      - name: Run action
        id: action
        uses: ./action

      - name: Assert output
        run: |
          echo "Generated UUID: ${{ steps.action.outputs.uuid }}"
          if [[ ! ${{ steps.action.outputs.uuid }} =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo "Output is not a valid UUID v4"
            exit 1
          fi
